<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>登入 - 珮藏居採購管理系統</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .login-card {
            border: none;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            background: #ffffff;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-5">
                <div class="card login-card p-4 p-md-5">
                    <div class="text-center mb-4">
                        <h3 class="fw-bold text-dark">珮藏居採購系統</h3>
                        <p class="text-muted small">請輸入您的帳號密碼以登入系統</p>
                    </div>

                    {% with messages = get_flashed_messages(with_categories=true) %}
                      {% if messages %}
                        {% for category, message in messages %}
                          <div class="alert alert-{{ category }} alert-dismissible fade show py-2 small" role="alert">
                            {{ message }}
                            <button type="button" class="btn-close py-2" data-bs-dismiss="alert" aria-label="Close"></button>
                          </div>
                        {% endfor %}
                      {% endif %}
                    {% endwith %}

                    <form method="POST">
                        <div class="mb-3">
                            <label class="form-label text-secondary small fw-bold">使用者編號 (ID)</label>
                            <input type="text" name="user_id" class="form-control" placeholder="例如: 01" required autofocus>
                        </div>
                        <div class="mb-4">
                            <label class="form-label text-secondary small fw-bold">密碼 (Password)</label>
                            <input type="password" name="password" class="form-control" placeholder="請輸入密碼" required>
                        </div>
                        <button type="submit" class="btn btn-dark w-100 py-2 fw-bold">安全登入</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
